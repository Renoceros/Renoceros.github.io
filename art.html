<!DOCTYPE html>
<html lang="en" data-theme="dark" class="art-html">
<head>
  <meta charset="UTF-8" />
  <title>Moreno Kristovan | Atelier</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="description" content="Visual work and artwork by Moreno Kristovan." />
  <meta name="author" content="Moreno Kristovan" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://renoceros.github.io/art.html" />
  <meta property="og:title" content="Moreno Kristovan | Atelier" />
  <meta property="og:description" content="Artwork and visual experiments." />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="apple-touch-icon" href="icon.svg">

  <!-- Google Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- Bootstrap 5 CSS & Shared Stylesheets -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="art.css">
</head>
<body class="art-mode">

  <!-- Ambient Spotlight Glow -->
  <div class="gallery-ambient"></div>

  <!-- Top Navigation (Clean Icon Portal) -->
  <nav class="navbar navbar-expand-lg fixed-top">
    <div class="container px-4">
      <a class="navbar-brand fw-bold" href="index.html">Renoceros<span>.</span></a>

      <div class="d-flex align-items-center gap-2 ms-auto">
        <a class="action-link d-none d-sm-inline-flex" href="assets/Moreno_Kristovan_CV.pdf" download="Moreno_Kristovan_CV.pdf" target="_blank" rel="noopener">
          <span class="material-symbols-outlined" style="font-size: 16px;">download</span>
          <span>Engineering CV</span>
        </a>

        <!-- Portal Switch: Clean Terminal Icon -->
        <a id="modeToggle" class="mode-btn" href="index.html" role="button" aria-label="Systems" title="Systems Portfolio (or press 'V')">
          <span class="material-symbols-outlined icon">terminal</span>
        </a>

        <!-- Theme Toggle -->
        <div id="themeToggle" class="theme-btn" role="button" aria-label="Toggle dark/light theme" title="Toggle Theme (or press 'T')">
          <span class="material-symbols-outlined icon">light_mode</span>
        </div>
      </div>
    </div>
  </nav>

  <!-- 3D Circular Wheel Stage (Top of the Wheel) -->
  <main class="wheel-stage" id="wheelStage" aria-label="Circular Art Wheel">
    <div class="wheel-apex" id="wheelApex">

      <!-- 01 -->
      <article class="wheel-card" data-idx="0" data-full="assets/artwork/3waydeadlock.png">
        <img src="assets/artwork/3waydeadlock.png" alt="Artwork" loading="eager" decoding="async" />
      </article>

      <!-- 02 -->
      <article class="wheel-card" data-idx="1" data-full="assets/artwork/Dutch_Lion.png">
        <img src="assets/artwork/Dutch_Lion.png" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 03 -->
      <article class="wheel-card" data-idx="2" data-full="assets/artwork/IMG_4189.jpg">
        <img src="assets/artwork/IMG_4189.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 04 -->
      <article class="wheel-card" data-idx="3" data-full="assets/artwork/IMG_4225.jpg">
        <img src="assets/artwork/IMG_4225.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 05 -->
      <article class="wheel-card" data-idx="4" data-full="assets/artwork/IMG_4237.jpg">
        <img src="assets/artwork/IMG_4237.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 06 -->
      <article class="wheel-card" data-idx="5" data-full="assets/artwork/IMG_5208.jpg">
        <img src="assets/artwork/IMG_5208.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 07 -->
      <article class="wheel-card" data-idx="6" data-full="assets/artwork/IMG_6180.jpg">
        <img src="assets/artwork/IMG_6180.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 08 -->
      <article class="wheel-card" data-idx="7" data-full="assets/artwork/IMG_6185.jpg">
        <img src="assets/artwork/IMG_6185.jpg" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 09 -->
      <article class="wheel-card" data-idx="8" data-full="assets/artwork/MadMax.png">
        <img src="assets/artwork/MadMax.png" alt="Artwork" loading="lazy" decoding="async" />
      </article>

      <!-- 10 -->
      <article class="wheel-card" data-idx="9" data-full="assets/artwork/Untitled_Artwork 8.png">
        <img src="assets/artwork/Untitled_Artwork 8.png" alt="Artwork" loading="lazy" decoding="async" />
      </article>

    </div>
  </main>

  <!-- Fullscreen Darkroom Lightbox Modal -->
  <div class="darkroom-modal" id="darkroomModal" role="dialog" aria-modal="true" aria-label="Artwork Inspector">
    <div class="darkroom-close-btn" id="modalClose" aria-label="Close Inspector">
      <span class="material-symbols-outlined">close</span>
    </div>
    <div class="darkroom-img-wrapper">
      <img id="modalImage" src="" alt="Artwork Full View" />
    </div>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <!-- Circular Wheel Kinematics Engine -->
  <script src="art.js"></script>
  <!-- Datamosh Transition Engine -->
  <script src="datamosh.js"></script>
</body>
</html>
