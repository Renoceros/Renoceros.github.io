<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="transGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f" />
      <stop offset="100%" stop-color="#191d28" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#transGrad)" stroke="#272d3b" stroke-width="2" />
  
  <!-- Left Side: Source Manhwa Comic Panel with OCR Bounding Boxes -->
  <g transform="translate(60, 60)">
    <rect width="310" height="380" rx="10" fill="#141822" stroke="#2c3444" stroke-width="1.5" />
    <!-- Manga panel illustration silhouettes -->
    <rect x="25" y="25" width="260" height="150" rx="6" fill="#1e2433" />
    <path d="M 40 150 Q 80 80 120 150 T 200 150 T 270 150" fill="#293144" />
    
    <!-- Speech bubble 1 with OCR detection box -->
    <rect x="40" y="40" width="130" height="55" rx="12" fill="#2d3748" stroke="#0071e3" stroke-width="2" stroke-dasharray="4,3" />
    <text x="50" y="62" font-family="-apple-system, sans-serif" font-size="11" fill="#70b1ff">[OCR: BBOX_01]</text>
    <text x="50" y="80" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">무슨 일이야?!</text>
    
    <!-- Speech bubble 2 with OCR detection box -->
    <rect x="150" y="210" width="135" height="60" rx="12" fill="#2d3748" stroke="#0071e3" stroke-width="2" stroke-dasharray="4,3" />
    <text x="160" y="232" font-family="-apple-system, sans-serif" font-size="11" fill="#70b1ff">[OCR: BBOX_02]</text>
    <text x="160" y="252" font-family="sans-serif" font-size="12" font-weight="700" fill="#ffffff">준비는 끝났다.</text>
    
    <text x="25" y="360" font-family="-apple-system, monospace" font-size="11" fill="#86868b">INPUT: RAW SOURCE PANEL</text>
  </g>

  <!-- Middle Arrow / Pipeline Node -->
  <g transform="translate(388, 220)">
    <circle cx="12" cy="15" r="22" fill="#1c2434" stroke="#0071e3" stroke-width="2" />
    <path d="M 6 15 L 18 15 M 13 10 L 18 15 L 13 20" fill="none" stroke="#0071e3" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right Side: Translated Typeset Output -->
  <g transform="translate(430, 60)">
    <rect width="310" height="380" rx="10" fill="#141822" stroke="#2a803d" stroke-width="1.5" />
    <rect x="25" y="25" width="260" height="150" rx="6" fill="#1e2433" />
    <path d="M 40 150 Q 80 80 120 150 T 200 150 T 270 150" fill="#293144" />
    
    <!-- Inpainted & Translated Bubble 1 -->
    <rect x="40" y="40" width="130" height="55" rx="12" fill="#ffffff" stroke="#2a803d" stroke-width="2" />
    <text x="48" y="62" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a803d">LLM CONTEXTUAL</text>
    <text x="48" y="80" font-family="Impact, sans-serif" font-size="12" fill="#000000">WHAT HAPPENED?!</text>
    
    <!-- Inpainted & Translated Bubble 2 -->
    <rect x="150" y="210" width="135" height="60" rx="12" fill="#ffffff" stroke="#2a803d" stroke-width="2" />
    <text x="158" y="232" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#2a803d">LOCALIZED</text>
    <text x="158" y="252" font-family="Impact, sans-serif" font-size="12" fill="#000000">PREPARATIONS DONE.</text>

    <text x="25" y="360" font-family="-apple-system, monospace" font-size="11" fill="#2a803d">OUTPUT: TYPESET &amp; INPAINTED</text>
  </g>
</svg>
