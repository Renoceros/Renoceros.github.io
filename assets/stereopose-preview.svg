<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgStereo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16181d" />
      <stop offset="100%" stop-color="#0c0d10" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bgStereo)" rx="16" />
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" rx="15" />
  
  <!-- 3D Stereo Vision Wireframe -->
  <g transform="translate(150, 80)">
    <rect x="0" y="0" width="900" height="540" fill="#121418" rx="12" stroke="#ffffff" stroke-opacity="0.06" />
    
    <!-- Left / Right Stereo Camera Frustum Lines -->
    <circle cx="200" cy="120" r="14" fill="#d2a8ff" opacity="0.8" />
    <text x="200" y="150" fill="#8b949e" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">Cam L</text>
    
    <circle cx="700" cy="120" r="14" fill="#d2a8ff" opacity="0.8" />
    <text x="700" y="150" fill="#8b949e" font-family="'SF Mono', monospace" font-size="11" text-anchor="middle">Cam R</text>
    
    <!-- 3D Bounding Box in Center Space -->
    <g transform="translate(450, 300)" stroke="#bc8cff" stroke-width="2" fill="none">
      <polygon points="-80,-60 80,-60 80,60 -80,60" stroke-opacity="0.9" />
      <polygon points="-40,-100 120,-100 120,20 -40,20" stroke-opacity="0.5" stroke-dasharray="4,4" />
      <line x1="-80" y1="-60" x2="-40" y2="-100" stroke-opacity="0.6" />
      <line x1="80" y1="-60" x2="120" y2="-100" stroke-opacity="0.6" />
      <line x1="80" y1="60" x2="120" y2="20" stroke-opacity="0.6" />
      <line x1="-80" y1="60" x2="-40" y2="20" stroke-opacity="0.6" />
      
      <!-- Coordinate Axis -->
      <line x1="0" y1="0" x2="40" y2="0" stroke="#ff7b72" stroke-width="3" />
      <line x1="0" y1="0" x2="0" y2="-40" stroke="#7ee787" stroke-width="3" />
      <line x1="0" y1="0" x2="-25" y2="25" stroke="#79c0ff" stroke-width="3" />
    </g>
    
    <line x1="200" y1="120" x2="370" y2="240" stroke="#d2a8ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4" />
    <line x1="700" y1="120" x2="570" y2="240" stroke="#d2a8ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="4,4" />
    
    <!-- Model Architecture Tag -->
    <rect x="250" y="450" width="400" height="50" fill="#1f2328" rx="6" stroke="#bc8cff" stroke-opacity="0.3" />
    <text x="450" y="480" fill="#d2a8ff" font-family="'SF Mono', monospace" font-size="12" text-anchor="middle">ConvNeXt V2 Nano Backbone | 6DoF Pose Estimation</text>
  </g>
  
  <!-- Placeholder Badge -->
  <rect x="450" y="680" width="300" height="34" fill="#1f242c" rx="17" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="600" y="702" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DROP IN: assets/stereopose-preview.png</text>
</svg>
