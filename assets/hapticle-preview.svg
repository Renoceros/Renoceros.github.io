<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="hapticGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c2432" />
      <stop offset="100%" stop-color="#0a0c10" />
    </radialGradient>
    <linearGradient id="dialRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48484a" />
      <stop offset="50%" stop-color="#1c1c1e" />
      <stop offset="100%" stop-color="#3a3a3c" />
    </linearGradient>
    <linearGradient id="accentHaptic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34c759" />
      <stop offset="100%" stop-color="#30d158" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#hapticGlow)" stroke="#222834" stroke-width="2" />

  <!-- Rotary Safe Dial (Left) -->
  <g transform="translate(240, 250)">
    <!-- Outer mechanical notches -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="#2c3340" stroke-width="3" />
    <!-- Dial notches -->
    <g stroke="#3a4456" stroke-width="2" opacity="0.8">
      <line x1="0" y1="-160" x2="0" y2="-145" />
      <line x1="160" y1="0" x2="145" y2="0" />
      <line x1="0" y1="160" x2="0" y2="145" />
      <line x1="-160" y1="0" x2="-145" y2="0" />
      <line x1="113" y1="113" x2="102" y2="102" />
      <line x1="-113" y1="113" x2="-102" y2="102" />
      <line x1="113" y1="-113" x2="102" y2="-102" />
      <line x1="-113" y1="-113" x2="-102" y2="-102" />
    </g>
    <!-- Dial Body -->
    <circle cx="0" cy="0" r="130" fill="url(#dialRim)" stroke="#3a4456" stroke-width="4" />
    <circle cx="0" cy="0" r="90" fill="#14171f" stroke="#222834" stroke-width="2" />
    <!-- Rotation Indicator Knurling -->
    <line x1="0" y1="-90" x2="0" y2="-40" stroke="#34c759" stroke-width="4" stroke-linecap="round" />
    <circle cx="0" cy="0" r="12" fill="#34c759" />
    
    <!-- Tactile Haptic Resonance Rings -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="#34c759" stroke-width="1.5" stroke-dasharray="3,6" opacity="0.6" />
    <circle cx="0" cy="0" r="175" fill="none" stroke="#34c759" stroke-width="1" stroke-dasharray="2,8" opacity="0.3" />
  </g>

  <!-- Right Side: Oscilloscope & CoreHaptics Waveforms -->
  <g transform="translate(480, 110)">
    <rect width="260" height="280" rx="12" fill="#11141c" stroke="#242c3c" stroke-width="1.5" />
    
    <!-- Header -->
    <text x="20" y="32" font-family="-apple-system, monospace" font-size="12" font-weight="700" fill="#f5f5f7">COREHAPTICS TRANSIENT</text>
    <text x="20" y="50" font-family="-apple-system, monospace" font-size="10" fill="#34c759">EVENT: NOTCH_SNAP_DETENT</text>
    
    <!-- Waveform grid -->
    <g opacity="0.15" stroke="#fff" stroke-dasharray="2,4">
      <line x1="20" y1="80" x2="240" y2="80" />
      <line x1="20" y1="130" x2="240" y2="130" />
      <line x1="20" y1="180" x2="240" y2="180" />
      <line x1="20" y1="230" x2="240" y2="230" />
    </g>

    <!-- Synthetic Impulse Waveform -->
    <path d="M 20 130 Q 50 130 65 70 T 80 190 T 95 110 T 110 145 T 130 130 L 240 130" fill="none" stroke="url(#accentHaptic)" stroke-width="3" stroke-linecap="round" />

    <!-- Secondary Harmonic Waveform -->
    <path d="M 20 200 Q 60 200 75 160 T 90 230 T 105 185 T 125 200 L 240 200" fill="none" stroke="#0071e3" stroke-width="2" stroke-linecap="round" opacity="0.8" />

    <text x="20" y="260" font-family="-apple-system, monospace" font-size="10" fill="#86868b">SHARPNESS: 0.95 | INTENSITY: 1.0</text>
  </g>
</svg>
