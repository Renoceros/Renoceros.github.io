<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="deepOcean" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#041220" />
      <stop offset="60%" stop-color="#07223b" />
      <stop offset="100%" stop-color="#0e3a5a" />
    </linearGradient>
    <linearGradient id="caustic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#0071e3" stop-opacity="0" />
      <stop offset="100%" stop-color="#00ffff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="spongeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b90" />
      <stop offset="100%" stop-color="#ff4081" />
    </linearGradient>
  </defs>

  <!-- Deep Ocean Background Plane (Layer 1) -->
  <rect width="800" height="500" rx="16" fill="url(#deepOcean)" stroke="#113658" stroke-width="2" />
  <rect width="800" height="500" rx="16" fill="url(#caustic)" />

  <!-- Background Rock Silhouettes (Layer 2 - Far Plane) -->
  <path d="M 0 380 Q 180 260 380 340 T 700 290 T 800 360 L 800 500 L 0 500 Z" fill="#061c30" opacity="0.8" />
  
  <!-- Midground Reef Bed (Layer 3 - Mid Plane) -->
  <path d="M 0 420 Q 220 360 440 410 T 800 390 L 800 500 L 0 500 Z" fill="#082845" />

  <!-- Healthy Coral Colony: Staghorn & Brain Coral -->
  <!-- Brain Coral -->
  <g transform="translate(180, 390)">
    <ellipse cx="0" cy="0" rx="65" ry="50" fill="#2ac99d" stroke="#1da880" stroke-width="3" />
    <path d="M -40 -15 Q -20 -35 0 -15 T 40 -15" fill="none" stroke="#168b69" stroke-width="3" stroke-linecap="round" />
    <path d="M -50 10 Q -25 25 0 10 T 50 10" fill="none" stroke="#168b69" stroke-width="3" stroke-linecap="round" />
    <text x="-35" y="4" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#064232">BRAIN CORAL</text>
  </g>

  <!-- Staghorn Branches -->
  <g transform="translate(360, 410)" stroke="#ff9f43" stroke-width="12" stroke-linecap="round">
    <line x1="0" y1="0" x2="-20" y2="-60" />
    <line x1="-20" y1="-60" x2="-50" y2="-100" />
    <line x1="-20" y1="-60" x2="0" y2="-110" />
    <line x1="0" y1="0" x2="30" y2="-70" />
    <line x1="30" y1="-70" x2="20" y2="-120" />
    <line x1="30" y1="-70" x2="60" y2="-100" />
  </g>

  <!-- Table Coral (Right) -->
  <g transform="translate(620, 380)">
    <path d="M -10 20 L -5 -30 L 10 -30 L 15 20 Z" fill="#b06240" />
    <ellipse cx="0" cy="-35" rx="80" ry="22" fill="#ff7675" stroke="#d63031" stroke-width="3" />
    <text x="-40" y="-32" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" fill="#ffffff">TABLE CORAL</text>
  </g>

  <!-- Tactile Care Tool: Sponge Algae Brush & Particle Sparkles -->
  <g transform="translate(490, 240)">
    <!-- Motion streak -->
    <path d="M -40 60 Q 20 20 60 -10" fill="none" stroke="#ff7b90" stroke-width="2" stroke-dasharray="4,4" opacity="0.6" />
    <!-- Sponge Tool -->
    <rect x="0" y="0" width="70" height="45" rx="14" fill="url(#spongeGrad)" stroke="#ffffff" stroke-width="2" transform="rotate(-15)" />
    <circle cx="20" cy="20" r="3" fill="#fff" opacity="0.7" />
    <circle cx="45" cy="18" r="4" fill="#fff" opacity="0.7" />
    <circle cx="32" cy="30" r="3" fill="#fff" opacity="0.7" />
    <!-- Sparkles -->
    <polygon points="15,-10 18,-2 26,0 18,2 15,10 12,2 4,0 12,-2" fill="#00ffff" />
    <polygon points="65,-5 67,0 72,2 67,4 65,9 63,4 58,2 63,0" fill="#ffff00" />
    <text x="-80" y="-12" font-family="-apple-system, monospace" font-size="11" font-weight="700" fill="#ff7b90">ALGAE BRUSH // ACTIVE</text>
  </g>

  <!-- HUD Telemetry Overlay -->
  <g transform="translate(50, 45)">
    <rect width="280" height="46" rx="10" fill="#051726" stroke="#163858" stroke-width="1.5" />
    <circle cx="20" cy="23" r="5" fill="#2ac99d" />
    <text x="35" y="27" font-family="-apple-system, monospace" font-size="12" font-weight="700" fill="#f5f5f7">REEFORA // 2.5D ECO-ENGINE</text>
  </g>

  <g transform="translate(530, 45)">
    <rect width="220" height="46" rx="10" fill="#051726" stroke="#163858" stroke-width="1.5" />
    <text x="18" y="27" font-family="-apple-system, monospace" font-size="11" fill="#70b1ff">DIVERSITY INDEX: 2.84 H'</text>
  </g>
</svg>
