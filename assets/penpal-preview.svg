<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgPenpal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161f" />
      <stop offset="100%" stop-color="#090c10" />
    </linearGradient>
    <linearGradient id="penStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388bfd" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#79c0ff" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="750" fill="url(#bgPenpal)" rx="16" />
  <rect x="1" y="1" width="1198" height="748" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" rx="15" />
  
  <!-- Canvas Workspace Mockup -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="1000" height="580" fill="#161b22" rx="12" stroke="#ffffff" stroke-opacity="0.06" />
    
    <!-- Floating Apple Pencil Toolbar -->
    <rect x="360" y="30" width="280" height="48" fill="#21262d" rx="24" stroke="#ffffff" stroke-opacity="0.1" />
    <circle cx="395" cy="54" r="14" fill="#388bfd" />
    <circle cx="440" cy="54" r="12" fill="#8b949e" opacity="0.3" />
    <circle cx="480" cy="54" r="12" fill="#8b949e" opacity="0.3" />
    <circle cx="520" cy="54" r="12" fill="#8b949e" opacity="0.3" />
    <rect x="560" y="44" width="60" height="20" fill="#238636" rx="10" />
    <text x="590" y="58" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle">LIVE</text>
    
    <!-- Dynamic Calligraphic Ink Stroke -->
    <path d="M 120 380 C 220 180, 360 480, 500 240 C 640 60, 780 440, 880 280" fill="none" stroke="url(#penStroke)" stroke-width="8" stroke-linecap="round" />
    <path d="M 140 400 C 240 200, 380 500, 520 260 C 660 80, 800 460, 900 300" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6,6" opacity="0.4" />
    
    <!-- Real-time Haptic & Pressure Telemetry Box -->
    <rect x="60" y="420" width="380" height="120" fill="#0d1117" rx="8" stroke="#388bfd" stroke-opacity="0.3" />
    <text x="80" y="450" fill="#58a6ff" font-family="'SF Mono', monospace" font-size="12" font-weight="600">PKCanvasView Touch Pipeline</text>
    <text x="80" y="475" fill="#8b949e" font-family="'SF Mono', monospace" font-size="11">Sampling Frequency: 240Hz (Apple Pencil Pro)</text>
    <text x="80" y="495" fill="#8b949e" font-family="'SF Mono', monospace" font-size="11">CoreHaptics Damping: Dynamic Rotary Tension</text>
    <text x="80" y="515" fill="#3fb950" font-family="'SF Mono', monospace" font-size="11">SwiftUI View Contract: &lt; 300 LOC Modular</text>
  </g>
  
  <!-- Placeholder Badge -->
  <rect x="450" y="680" width="300" height="34" fill="#1f242c" rx="17" stroke="#ffffff" stroke-opacity="0.1" />
  <text x="600" y="702" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">DROP IN: assets/penpal-preview.png</text>
</svg>
